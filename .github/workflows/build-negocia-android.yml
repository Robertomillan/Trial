name: Build Negocia.AI Android Beta

on:
  push:
    branches: [negocia-ai-render]
    paths:
      - 'android-negocia/**'
      - 'index.html'
      - 'styles-v091.css'
      - 'ux-v093.css'
      - 'history-detail-v097.css'
      - 'brand-v091.js'
      - 'app-core-v091.js'
      - 'app-strategy-v091.js'
      - 'app-engine-v091.js'
      - 'app-ui-v091.js'
      - 'commercial-structure-v092.js'
      - 'ux-tone-v093.js'
      - 'robust-v094.js'
      - 'robust-v0941.js'
      - 'materials-v095.js'
      - 'status-history-v096.js'
      - 'history-detail-v097.js'
      - '.github/workflows/build-negocia-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 using preinstalled SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore persistent Negocia.AI beta signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: negocia-ai-beta-debug-keystore-v1

      - name: Create beta signing key on first run only
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep -E "SHA256:|Alias name:" || true

      - name: Generate exact Negocia.AI launcher icon from brand asset
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image

          src = Path("brand-v091.js").read_text(encoding="utf-8")
          m = re.search(r"data:image/webp;base64,([A-Za-z0-9+/=]+)", src)
          if not m:
              raise SystemExit("BRAND_LOGO not found")
          img = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert("RGB")
          h = img.height
          # Start from the approved symbol at the left of the wordmark, then center its
          # visible mark precisely inside a square launcher canvas.
          raw = img.crop((0, 0, h, h))
          px = raw.load()
          bg = raw.getpixel((max(1, raw.width//20), max(1, raw.height//20)))
          def delta(p):
              return sum(abs(int(p[i])-int(bg[i])) for i in range(3))
          xs=[]; ys=[]
          for y in range(raw.height):
              for x in range(raw.width):
                  if delta(px[x,y]) > 42:
                      xs.append(x); ys.append(y)
          if xs and ys:
              pad = max(4, int(h*0.025))
              box=(max(0,min(xs)-pad),max(0,min(ys)-pad),min(raw.width,max(xs)+pad+1),min(raw.height,max(ys)+pad+1))
              symbol=raw.crop(box)
          else:
              symbol=raw
          canvas=Image.new("RGB",(1024,1024),bg)
          max_side=760
          scale=min(max_side/symbol.width,max_side/symbol.height)
          size=(max(1,int(symbol.width*scale)),max(1,int(symbol.height*scale)))
          symbol=symbol.resize(size,Image.Resampling.LANCZOS)
          pos=((1024-size[0])//2,(1024-size[1])//2)
          canvas.paste(symbol,pos)
          mark=canvas
          out = Path("android-negocia/app/src/main/res/drawable")
          out.mkdir(parents=True, exist_ok=True)
          fallback = out / "ic_negocia.xml"
          if fallback.exists():
              fallback.unlink()
          mark.save(out / "ic_negocia.png", optimize=True)
          PY

      - name: Copy Negocia.AI web app into Android assets
        run: |
          ASSET_DIR="android-negocia/app/src/main/assets"
          mkdir -p "$ASSET_DIR"
          cp index.html "$ASSET_DIR/"
          cp styles-v091.css ux-v093.css history-detail-v097.css "$ASSET_DIR/"
          cp brand-v091.js app-core-v091.js app-strategy-v091.js app-engine-v091.js app-ui-v091.js "$ASSET_DIR/"
          cp commercial-structure-v092.js ux-tone-v093.js robust-v094.js robust-v0941.js "$ASSET_DIR/"
          cp materials-v095.js status-history-v096.js history-detail-v097.js "$ASSET_DIR/"

      - name: Compile installable debug APK
        working-directory: android-negocia
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish Negocia.AI Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: NegociaAI-Beta6-APK
          path: android-negocia/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
