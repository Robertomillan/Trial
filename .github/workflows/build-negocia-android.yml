name: Build Negocia.AI Android Beta

on:
  push:
    branches: [negocia-ai-render]
    paths:
      - 'android-negocia/**'
      - 'index.html'
      - 'styles-v091.css'
      - 'ux-v093.css'
      - 'history-detail-v097.css'
      - 'brand-v091.js'
      - 'assets/negocia-icon.webp'
      - 'app-core-v091.js'
      - 'app-strategy-v091.js'
      - 'app-engine-v091.js'
      - 'app-ui-v091.js'
      - 'commercial-structure-v092.js'
      - 'ux-tone-v093.js'
      - 'robust-v094.js'
      - 'robust-v0941.js'
      - 'materials-v095.js'
      - 'status-history-v096.js'
      - 'history-detail-v097.js'
      - 'context-engine-v101.js'
      - 'closure-guard-v106.js'
      - '.github/workflows/build-negocia-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 using preinstalled SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore fixed Negocia.AI beta signing key
        run: |
          mkdir -p android-negocia/beta-signing
          base64 -d android-negocia/beta-signing/negocia-beta-fixed.jks.b64 > android-negocia/beta-signing/negocia-beta-fixed.jks
          keytool -list -v \
            -keystore android-negocia/beta-signing/negocia-beta-fixed.jks \
            -storepass NegociaBeta2026 | grep -E "SHA256:|Alias name:"

      - name: Generate native Android launcher icons from embedded HD brand
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image

          src = Path("brand-v091.js").read_text(encoding="utf-8")
          m = re.search(r"BRAND_ICON='data:image/[^;]+;base64,([^']+)'", src)
          if not m:
              raise SystemExit("Embedded BRAND_ICON not found in brand-v091.js")

          raw = base64.b64decode(m.group(1))
          img = Image.open(io.BytesIO(raw)).convert("RGBA")
          res = Path("android-negocia/app/src/main/res")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              out = res / folder
              out.mkdir(parents=True, exist_ok=True)
              icon = img.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(out / "ic_launcher.png", optimize=True)
              icon.save(out / "ic_launcher_round.png", optimize=True)

          old = res / "drawable"
          for name in ("ic_negocia.xml","ic_negocia.png","ic_negocia.webp","negocia_symbol.png"):
              p = old / name
              if p.exists():
                  p.unlink()
          PY

      - name: Copy Negocia.AI web app into Android assets
        run: |
          ASSET_DIR="android-negocia/app/src/main/assets"
          mkdir -p "$ASSET_DIR/assets"
          cp index.html "$ASSET_DIR/"
          cp assets/negocia-icon.webp "$ASSET_DIR/assets/"
          cp styles-v091.css ux-v093.css history-detail-v097.css "$ASSET_DIR/"
          cp brand-v091.js app-core-v091.js app-strategy-v091.js app-engine-v091.js app-ui-v091.js "$ASSET_DIR/"
          cp commercial-structure-v092.js ux-tone-v093.js robust-v094.js robust-v0941.js "$ASSET_DIR/"
          cp materials-v095.js status-history-v096.js history-detail-v097.js context-engine-v101.js closure-guard-v106.js "$ASSET_DIR/"

      - name: Compile installable debug APK
        working-directory: android-negocia
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signing certificate
        run: |
          APKSIGNER="/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner"
          APK="android-negocia/app/build/outputs/apk/debug/app-debug.apk"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-cert.txt
          grep -qi "581a2d9ba3a68e8b051156312756ae93eb957c15130f942cc5a8eb2302de635b" /tmp/apk-cert.txt

      - name: Publish Negocia.AI Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: NegociaAI-Beta19-APK
          path: android-negocia/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
