name: Build SalarioIA Android Beta

on:
  push:
    branches: [negocia-ai-render]
    paths:
      - 'android-salario/**'
      - 'salario-ia/index.html'
      - 'salario-ia/privacidade.html'
      - 'salario-ia/termos.html'
      - '.github/workflows/build-salario-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate embedded calculator JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('salario-ia/index.html').read_text()
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/salario-calculator.js').write_text(script)
          assert 'function pjInssAmount(pro)' in script
          assert 'function openTaxHelp(kind)' in script
          assert 'id="pInssAuto"' in html and 'id="cInssAuto"' in html
          PY
          node --check /tmp/salario-calculator.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 using preinstalled SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile test APK and debug bundle
        working-directory: android-salario
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleDebug
      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SalarioIA-Beta1-APK
          path: android-salario/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish debug AAB for technical tests
        uses: actions/upload-artifact@v4
        with:
          name: SalarioIA-Beta1-AAB-debug
          path: android-salario/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 30
