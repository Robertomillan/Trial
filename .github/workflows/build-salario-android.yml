name: Build SalarioIA Android Beta

on:
  push:
    branches: [negocia-ai-render]
    paths:
      - 'android-salario/**'
      - 'salario-ia/index.html'
      - 'salario-ia/privacidade.html'
      - 'salario-ia/termos.html'
      - '.github/workflows/build-salario-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate embedded calculator JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('salario-ia/index.html').read_text()
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/salario-calculator.js').write_text(script)
          assert 'function pjInssAmount(pro)' in script
          assert 'function openTaxHelp(kind)' in script
          assert 'id="pInssAuto"' in html and 'id="cInssAuto"' in html
          PY
          node --check /tmp/salario-calculator.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36 using preinstalled SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile test APK and debug bundle
        working-directory: android-salario
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleDebug
      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SalarioIA-Beta1-APK
          path: android-salario/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish debug AAB for technical tests
        uses: actions/upload-artifact@v4
        with:
          name: SalarioIA-Beta1-AAB-debug
          path: android-salario/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 30

      # Play Console requires a release AAB signed with a persistent upload key.
      # Configure the two SALARIOIA_* secrets in GitHub Actions; never commit keys.
      # Trigger release signing build after GitHub Actions secrets setup.
      - name: Check Google Play upload signing secrets
        id: signing
        env:
          SALARIOIA_KEYSTORE_BASE64: ${{ secrets.SALARIOIA_KEYSTORE_BASE64 }}
          SALARIOIA_KEYSTORE_PASSWORD: ${{ secrets.SALARIOIA_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$SALARIOIA_KEYSTORE_BASE64" && -n "$SALARIOIA_KEYSTORE_PASSWORD"  ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Signing credentials available; building Play-ready release AAB."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release AAB skipped: configure the two SALARIOIA_* GitHub Actions secrets."
          fi

      - name: Build and sign Google Play release AAB
        if: steps.signing.outputs.ready == 'true'
        env:
          SALARIOIA_KEYSTORE_BASE64: ${{ secrets.SALARIOIA_KEYSTORE_BASE64 }}
          SALARIOIA_KEYSTORE_PASSWORD: ${{ secrets.SALARIOIA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SALARIOIA_KEYSTORE_BASE64" | base64 --decode > /tmp/salarioia-upload.jks
          (cd android-salario && gradle --no-daemon --stacktrace :app:bundleRelease)
          INPUT="android-salario/app/build/outputs/bundle/release/app-release.aab"
          OUTPUT="android-salario/app/build/outputs/bundle/release/SalarioIA-Play-1.0.0-beta2.aab"
          jarsigner -keystore /tmp/salarioia-upload.jks \
            -storepass:env SALARIOIA_KEYSTORE_PASSWORD \
            -keypass:env SALARIOIA_KEYSTORE_PASSWORD \
            -signedjar "$OUTPUT" "$INPUT" "salarioia-upload"
          jarsigner -verify "$OUTPUT" | grep -q 'jar verified.'
          rm -f /tmp/salarioia-upload.jks
          echo "Release AAB signed and verified."

      - name: Publish signed AAB for Google Play Console
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SalarioIA-Play-AAB-assinado
          path: android-salario/app/build/outputs/bundle/release/SalarioIA-Play-1.0.0-beta2.aab
          if-no-files-found: error
          retention-days: 30
