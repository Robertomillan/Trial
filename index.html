<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061f35"><title>Negocia.AI</title><style>:root{--navy:#061f35;--blue:#0b3b5b;--teal:#10b7a5;--bg:#f3f7fa;--line:#d8e3ea;--text:#08233a}*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{background:var(--navy);color:white;padding:18px 20px}.brand{font-size:27px;font-weight:800}.brand b{color:#20d8bd}.tag{font-size:11px;color:#b9d1df}.wrap{max-width:520px;margin:auto;padding:14px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;margin:10px 0;box-shadow:0 3px 12px #08233a0b}.navy{background:#0b3b5b;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{text-align:center}.metric b{display:block;font-size:17px}.metric small{font-size:10px;color:#73899a}.navy small{color:#c6dce7}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit}textarea{min-height:86px}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:var(--teal);color:white}.row{display:flex;gap:8px}.row>*{flex:1}.tabs{display:flex;background:#e9f0f4;border-radius:12px;padding:3px}.tabs button{background:transparent;color:#587080;padding:9px}.tabs button.on{background:white;color:var(--navy);box-shadow:0 2px 7px #0001}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#e8f8f4;color:#087e70;font-size:11px;font-weight:800}.line{border-top:1px solid #ffffff55;margin:10px 0}.result{display:none}.result.show{display:block}.good{border-left:3px solid var(--teal);padding-left:11px}.warn{background:#fff7e7;border-color:#f0d28d}.quote{background:#edf9f7;padding:13px;border-radius:12px;line-height:1.45}.money{font-size:18px;font-weight:800}.muted{color:#6f8494;font-size:12px}.navy .muted{color:#c4d8e3}.chat{max-height:260px;overflow:auto}.msg{padding:10px 12px;border-radius:14px;margin:7px 0;max-width:88%}.them{background:#0b3b5b;color:white}.me{background:#eaf0f4;margin-left:auto}.switch{display:flex;gap:5px;margin:8px 0}.switch button{background:#e8eff3;color:#38556a;padding:8px}.switch button.on{background:var(--navy);color:white}</style></head><body><header><div class="brand">Negocia.<b>AI</b></div><div class="tag">Estratégia, confiança e resultados.</div></header><main class="wrap"><span class="pill">Copiloto Negocia.AI · online</span><div class="card"><h2>Nova negociação</h2><label>Objeto</label><input id="obj" placeholder="Ex.: carro, contrato, salário"><div class="row"><div><label>Seu alvo</label><input id="target" inputmode="decimal" value="190000"></div><div><label>Seu limite</label><input id="limit" inputmode="decimal" value="215000"></div></div><label>Taxa anual para TCO / valor presente</label><input id="rate" inputmode="decimal" value="15"><button style="width:100%;margin-top:14px" onclick="start()">Preparar estratégia</button></div><section id="room" class="result"><div class="grid"><div class="card metric"><b id="mTarget"></b><small>Alvo</small></div><div class="card metric"><b id="mLimit"></b><small>Limite</small></div><div class="card metric"><b>Baixo</b><small>Poder</small></div></div><div class="card navy"><b>Estratégia pronta.</b><p class="muted">Cole a resposta da contraparte. O motor considera preço, condição financeira, concessões e histórico.</p></div><div class="card"><div class="chat" id="chat"></div><div class="switch"><button id="whoThem" class="on" onclick="who='them';syncWho()">Contraparte</button><button id="whoMe" onclick="who='me';syncWho()">Minha mensagem</button></div><textarea id="msg" placeholder="Cole aqui o que foi dito..."></textarea><button style="width:100%;margin-top:8px" onclick="send()">Analisar</button></div><div id="analysis"></div></section></main><script>let who='them',hist=[],cfg={};const brl=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');function num(v){return Number(String(v).replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',','.'))||0}function start(){cfg={target:num(target.value),limit:num(limit.value),rate:num(rate.value)/100,obj:obj.value||'negociação'};mTarget.textContent=brl(cfg.target);mLimit.textContent=brl(cfg.limit);room.classList.add('show');room.scrollIntoView({behavior:'smooth'})}function syncWho(){whoThem.classList.toggle('on',who==='them');whoMe.classList.toggle('on',who==='me')}function moneyFrom(t){let s=t.toLowerCase().replace(/r\$/g,'');let m=s.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d{4,9}(?:,\d{1,2})?|\d+(?:[.,]\d+)?\s*(?:mil|k))/i);if(!m)return null;let x=m[1].trim();if(/mil|k/i.test(x))return parseFloat(x.replace(/mil|k/ig,'').replace('.','').replace(',','.'))*1000;return num(x)}function classify(t){t=t.toLowerCase();if(/30|60|90|parcela|prazo|pagamento|à vista|a vista|entrada/.test(t))return'Condição de pagamento';if(/ger[eê]ncia|diretor|aprova|alçada/.test(t))return'Alçada / aprovação';if(/concorr|outra proposta|outro/.test(t))return'Alternativa / concorrência';if(/não baixo|nao baixo|mínimo|minimo|preço|preco|valor/.test(t))return'Preço / limite';return'Resistência / diagnóstico'}function pvInstallments(t,offer){let days=[...t.matchAll(/(\d{1,3})\s*dias?/gi)].map(x=>+x[1]);let nx=(t.match(/(\d+)\s*x/i)||[])[1];if(!offer||(!days.length&&!nx))return null;if(!days.length&&nx){for(let i=1;i<=+nx;i++)days.push(i*30)}let n=days.length||1,part=offer/n,pv=days.reduce((a,d)=>a+part/Math.pow(1+cfg.rate,d/365),0);return{pv,benefit:offer-pv,days}}function trend(){let o=hist.filter(x=>x.who==='them'&&x.offer).map(x=>x.offer);if(o.length<2)return null;let d=o[o.length-2]-o[o.length-1];return{last:o[o.length-1],delta:d,text:d>0?'A contraparte está cedendo. Preserve reciprocidade e reduza o tamanho da sua próxima concessão.':d<0?'A contraparte endureceu. Não corra atrás do número; volte aos critérios e alternativas.':'Não houve concessão nominal. Busque condição, escopo ou informação antes de mover preço.'}}function send(){let t=msg.value.trim();if(!t)return;let offer=moneyFrom(t),kind=classify(t);hist.push({who,text:t,offer});chat.innerHTML+=`<div class="msg ${who==='them'?'them':'me'}">${t}</div>`;msg.value='';if(who==='me'){analysis.innerHTML='<div class="card"><b>Mensagem registrada</b><p class="muted">Sua fala entrou no histórico, mas não será tratada como posição da contraparte.</p></div>';return}let pv=pvInstallments(t,offer),tr=trend(),dir=cfg.target<cfg.limit?'buy':'sell';let status=offer?(dir==='buy'?(offer<=cfg.target?'Dentro do alvo':offer<=cfg.limit?'Faixa negociável':'Acima do limite'):(offer>=cfg.target?'Dentro do alvo':offer>=cfg.limit?'Faixa negociável':'Abaixo do limite')):'Sem oferta numérica';let next=offer?(dir==='buy'?Math.round(cfg.target+(cfg.limit-cfg.target)*.45):Math.round(cfg.limit+(cfg.target-cfg.limit)*.4)):cfg.target;let lever=kind==='Condição de pagamento'?'Converta prazo e parcelamento em valor presente. Compare o custo total econômico, não apenas o preço nominal.':kind==='Preço / limite'?'Teste se o limite é real antes de conceder. Use alternativa, benchmark, escopo e condição financeira como moedas.':kind==='Alçada / aprovação'?'Descubra quem decide, qual faixa é defensável e quais critérios liberam a aprovação.':'Faça a contraparte revelar o obstáculo antes de mover sua posição.';let q=kind==='Condição de pagamento'?'Se eu comparar essa condição pelo valor presente, qual é a melhor combinação entre preço à vista e parcelado que você consegue aprovar?':kind==='Preço / limite'?'O que precisaria mudar em prazo, pagamento ou escopo para você melhorar esse número sem perder o fechamento?':'O que exatamente impede avançarmos agora: preço, prazo, risco, escopo ou aprovação?';let resp=kind==='Condição de pagamento'?`Entendi a condição. Para mim, preço e prazo fazem parte do mesmo TCO. Vou comparar o equivalente à vista e, se houver ganho econômico real, consigo considerar isso na decisão. O que você melhora no preço se eu simplificar o pagamento?`:`Entendo sua posição. Antes de eu mover meu valor, preciso entender o que sustenta esse limite. Se houver uma contrapartida concreta, consigo avaliar ${brl(next)}.`;analysis.innerHTML=`<div class="card navy"><b>Leitura da contraparte</b><h3>${kind}</h3>${offer?`<div class="line"></div><div>Oferta detectada <b style="float:right">${brl(offer)}</b></div><div style="margin-top:8px">Leitura da faixa <b style="float:right">${status}</b></div>`:''}</div>${pv?`<div class="card"><h3>Impacto financeiro / TCO</h3><div class="row"><div><span class="muted">Preço nominal</span><div class="money">${brl(offer)}</div></div><div><span class="muted">Equivalente à vista</span><div class="money">${brl(pv.pv)}</div></div></div><p class="good">Benefício financeiro estimado do prazo: <b>${brl(pv.benefit)}</b>, usando ${(cfg.rate*100).toFixed(1)}% a.a.</p></div>`:''}${tr?`<div class="card"><h3>Memória das concessões</h3><p>${tr.text}</p><p class="muted">Último movimento nominal: ${brl(Math.abs(tr.delta))}.</p></div>`:''}<div class="card"><h3>Alavanca</h3><p>${lever}</p></div><div class="card"><h3>Pergunta de pressão</h3><div class="quote">${q}</div></div><div class="card"><h3>Concessão condicionada</h3><p>Se mover para <b>${brl(next)}</b>, peça algo de valor equivalente em pagamento, prazo, escopo, garantia ou fechamento.</p></div><div class="card"><h3>Resposta recomendada</h3><div class="quote">${resp}</div></div><div class="card warn"><h3>Próximo movimento</h3><p>${offer&&status.includes('limite')?'Não persiga a oferta. Faça a pergunta de pressão e teste flexibilidade antes de qualquer nova concessão.':'Use a informação obtida para decidir se há troca real antes de mover preço.'}</p></div>`;analysis.scrollIntoView({behavior:'smooth',block:'start'})}</script></body></html>
