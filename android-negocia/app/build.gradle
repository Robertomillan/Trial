plugins {
    id 'com.android.application'
}

android {
    namespace 'com.negociaai.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.negociaai.app'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.9.7-beta5'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
