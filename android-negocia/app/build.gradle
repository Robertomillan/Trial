plugins {
    id 'com.android.application'
}

android {
    namespace 'com.negociaai.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.negociaai.app'
        minSdk 24
        targetSdk 36
        versionCode 100
        versionName '1.0.0-closedtest1'
    }

    buildTypes {
        debug {
            // Local/debug builds use the standard Android debug signing key.
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
