plugins {
    id 'com.android.application'
}
android {
    namespace 'br.com.salarioia.app'
    compileSdk 36
    defaultConfig {
        applicationId 'br.com.salarioia.app'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.0-beta2'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.assets.srcDirs += ["${rootProject.projectDir}/../salario-ia"]
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
